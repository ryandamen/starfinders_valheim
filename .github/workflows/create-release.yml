name: Create GitHub release

on:
  workflow_call:
    inputs:
      package_version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.package_version }}
          name: ${{ inputs.package_version }}
          generate_release_notes: true
