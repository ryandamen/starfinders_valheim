name: Publish Thunderstore package

on:
  workflow_call:
    inputs:
      package_version:
        required: true
        type: string
    secrets:
      thunderstore_api_token:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for TOML parsing
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse Thunderstore dependencies
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("thunderstore.toml", "rb") as manifest:
              dependencies = tomllib.load(manifest)["package"]["dependencies"]

          dependency_lines = [
              f"{package}@{version}" for package, version in dependencies.items()
          ]
          if not dependency_lines:
              raise ValueError("No dependencies found in thunderstore.toml")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("deps<<THUNDERSTORE_DEPS\n")
              output.write("\n".join(dependency_lines))
              output.write("\nTHUNDERSTORE_DEPS\n")
        id: parsed-dependencies

      - name: Publish to ThunderStore
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.thunderstore_api_token }}
          community: valheim
          namespace: Starfinders
          name: starfinders_modpack
          description: Modpack for the Starfinders private Valheim server
          version: ${{ inputs.package_version }}
          repo: https://thunderstore.io
          path: .
          deps: ${{ steps.parsed-dependencies.outputs.deps }}

          categories: |
            modpacks
            deep-north-update
            ai-generated
            client-side
            server-side
