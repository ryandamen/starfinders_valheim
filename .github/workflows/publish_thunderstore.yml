name: Publish ThunderStore release

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish to ThunderStore
        id: publish
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_API_TOKEN }}
          community: valheim
          namespace: Starfinders
          name: starfinders_modpack
          description: Modpack for the Starfinders private Valheim server
          version: ${{ github.ref_name }}
          repo: https://thunderstore.io
          path: .
          deps: |
            denikson-BepInExPack_Valheim@5.4.2351
            ValheimModding-Jotunn@2.30.2
            ValheimModding-JsonDotNET@13.0.4
            ValheimModding-YamlDotNet@16.3.1
            shudnal-ConditionalConfigSync@1.0.11
            Advize-PlantEverything@1.21.4
            ishid4-BetterArchery@2.0.5
            OdinPlus-QuickTeleport@2.0.7
            BentoG-MissingPieces@2.3.2
            MaxiMods-MultiCraft@1.5.0
            Digitalroot-Better_Wisps@1.0.44
            blacks7ar-CoreWoodPieces@1.2.6
            blacks7ar-RefinedStonePieces@1.1.2
            Crystal-Pathfinder@2.2.5
            JereKuusela-Smoke_Collision@1.10.0
            Radamanto-ServerQuickConnect@1.0.4
            RandyKnapp-EquipmentAndQuickSlots@3.1.3
            Advize-PlantEasily@2.3.0
            Xenofell-TorchesEternal@0.2.0
            Digitalroot-Digitalroots_Slope_Combat_Assistance@2.0.30
            FF15Vikings-VikingQoL@1.4.0
            j1gA-LivingMap@0.19.2
          categories: |
            modpacks
            deep-north-update

      - name: Wait for Thunderstore availability
        env:
          PACKAGE_OWNER: Starfinders
          PACKAGE_NAME: starfinders_modpack
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          feed_url = "https://thunderstore.io/c/valheim/api/v1/package/"
          interval_seconds = 5 * 60
          max_checks = 50
          started_at = time.monotonic()

          for check in range(max_checks):
              try:
                  with urllib.request.urlopen(feed_url, timeout=30) as response:
                      packages = json.load(response)
                  if not isinstance(packages, list):
                      raise ValueError("Thunderstore package feed did not return a list")

                  available = any(
                      package.get("owner") == os.environ["PACKAGE_OWNER"]
                      and package.get("name") == os.environ["PACKAGE_NAME"]
                      and any(
                          version.get("version_number") == os.environ["PACKAGE_VERSION"]
                          and version.get("is_active") is True
                          for version in package.get("versions", [])
                      )
                      for package in packages
                  )
              except (urllib.error.URLError, TimeoutError, ValueError) as error:
                  print(f"Check {check + 1}/{max_checks}: Thunderstore feed check failed: {error}")
              else:
                  if available:
                      print(
                          f"{os.environ['PACKAGE_OWNER']}-{os.environ['PACKAGE_NAME']}"
                          f" {os.environ['PACKAGE_VERSION']} is active in the Thunderstore feed."
                      )
                      break
                  print(
                      f"Check {check + 1}/{max_checks}: version is not active in the "
                      "Thunderstore feed yet."
                  )

              if check + 1 == max_checks:
                  raise SystemExit(
                      f"Timed out waiting for {os.environ['PACKAGE_OWNER']}-"
                      f"{os.environ['PACKAGE_NAME']} {os.environ['PACKAGE_VERSION']} "
                      "to become active in the Thunderstore feed after 3 hours."
                  )
              next_check_at = started_at + (check + 1) * interval_seconds
              time.sleep(max(0, next_check_at - time.monotonic()))

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true

      - name: Notify Discord
        uses: Ilshidur/action-discord@ad5235de713df3ef38022185499b02ffe93b7efe
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PACKAGE_VERSION: ${{ github.ref_name }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        with:
          args: |
            **Starfinders modpack {{ PACKAGE_VERSION }} is now available!**
            Install it from Thunderstore: https://thunderstore.io/c/valheim/p/Starfinders/starfinders_modpack/
            GitHub release: {{ RELEASE_URL }}
