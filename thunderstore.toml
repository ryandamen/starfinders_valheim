[config]
schemaVersion = "0.0.1"

[package]
namespace = "starfinders"
name = "starfinders_modpack"
versionNumber = "0.0.1"
description = "Modpack for the starfinders valheim private server"
websiteUrl = "https://github.com/ryandamen/starfinders_valheim"
containsNsfwContent = false
[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
ValheimModding-Jotunn = "2.30.2"
ValheimModding-JsonDotNET = "13.0.4"
ValheimModding-YamlDotNet = "16.3.1"
shudnal-ConditionalConfigSync = "1.0.11"
Advize-PlantEverything = "1.21.3"
Goldenrevolver-Quick_Stack_Store_Sort_Trash_Restock = "1.4.16"
ishid4-BetterArchery = "2.0.5"
OdinPlus-QuickTeleport = "2.0.7"
MSchmoecker-MultiUserChest = "0.6.2"
BentoG-MissingPieces = "2.3.2"
MaxiMods-MultiCraft = "1.5.0"
Digitalroot-Better_Wisps = "1.0.44"
blacks7ar-CoreWoodPieces = "1.2.6"
blacks7ar-RefinedStonePieces = "1.1.2"
blacks7ar-FineWoodPieces = "1.6.7"
Crystal-Pathfinder = "2.2.5"
JereKuusela-Smoke_Collision = "1.10.0"
Schachio-ValheimStorage = "1.3.3"
Radamanto-ServerQuickConnect = "1.0.4"
StonedParadise-AnimalFeedingTrough = "1.0.5"
Zenox-BetterUI = "1.0.21"
RandyKnapp-EquipmentAndQuickSlots = "3.1.3"
Advize-PlantEasily = "2.3.0"
aruberuto-AreaRepair = "1.0.6"
Matheba-Build_Camera_Custom_Hammers_Edition = "1.3.2"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./dist"
target = ""


[publish]
repository = "https://thunderstore.io"
communities = [ "valheim", ]
[publish.categories]
valheim = ["modpacks",]
